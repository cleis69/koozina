<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Koozina Garden">
  <!--
    Favicon : le poulpe seul, sur pastille beige.
    Le badge complet (anneau + coquelicots + wordmark) devient illisible sous
    48 px — c'est la raison pour laquelle la marque est réduite ici.
    Aucune dépendance à une police : tout est en tracés.
  -->
  <rect width="200" height="200" rx="26" fill="#F7F1E6"/>

  <!-- manteau -->
  <path fill="#15140F" d="M100 26c29.5 0 51.5 21.8 51.5 51 0 14.9-5.1 27-14.2 37.1-4.8 5.3-8.4 10-10.7 15.1-1.7 3.9-5.5 6.2-9.7 6.2H83.1c-4.2 0-8-2.3-9.7-6.2-2.3-5.1-5.9-9.8-10.7-15.1C53.6 104 48.5 91.9 48.5 77c0-29.2 22-51 51.5-51Z"/>
  <!-- croissant clair -->
  <path fill="#F7F1E6" d="M91 64c0-8.5 6.2-15.5 14.2-16.5-1.6-.6-3.3-.9-5-.9-9 0-16.4 7.8-16.4 17.4S91.2 81.4 100.2 81.4c1.7 0 3.4-.3 5-.9C97.2 79.5 91 72.5 91 64Z"/>

  <!-- tentacules -->
  <g fill="none" stroke="#15140F" stroke-width="8" stroke-linecap="round">
    <path d="M74 137c-10 6-14 16-25 20s-17-2-16-10 10-11 15-6"/>
    <path d="M85 141c-8 13-8 26-17 35s-20 6-23-3 4-15 10-13"/>
    <path d="M98 144c-3 15 1 30-4 41s-16 12-22 5"/>
    <path d="M112 144c4 15 1 31 7 41s17 10 22 3"/>
    <path d="M125 140c9 12 10 24 20 32s20 3 22-6-5-14-12-12"/>
    <path d="M133 134c12 6 16 15 28 18s17-4 15-13-12-10-15-5"/>
  </g>

  <!-- ventouses -->
  <g fill="#F7F1E6">
    <circle cx="69" cy="147" r="2.7"/><circle cx="61" cy="156" r="2.7"/>
    <circle cx="55" cy="167" r="2.7"/><circle cx="51" cy="179" r="2.7"/>
    <circle cx="91" cy="158" r="2.7"/><circle cx="88" cy="172" r="2.7"/>
    <circle cx="85" cy="186" r="2.7"/>
